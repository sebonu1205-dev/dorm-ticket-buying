<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>寮食堂 食券たのむ</title>
  <meta name="theme-color" content="#c8501e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="食券たのむ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css?v=1.3">
</head>
<body>
<main>

  <!-- 1. 最初の画面 -->
  <section id="view-home">
    <h1>寮食堂 食券たのむ</h1>
    <p class="lead">名前を入れて、あてはまる方を選んでください。</p>
    <label>名前
      <input id="name" maxlength="20" autocomplete="off" placeholder="例: たろう">
    </label>
    <div id="home-error" class="error"></div>
    <button type="button" id="btn-resident" class="primary">寮生です</button>
    <button type="button" id="btn-guest" class="secondary">寮生ではありません</button>
  </section>

  <!-- 2. パスワード画面 -->
  <section id="view-pw" hidden>
    <h1 id="pw-title"></h1>
    <p id="pw-note" class="lead"></p>
    <label>パスワード
      <input id="pw-input" type="text" maxlength="30" autocomplete="off">
    </label>
    <p class="hint">※ 他のサービスと同じパスワードは使わないでください(簡易的な合言葉です)</p>
    <div id="pw-error" class="error"></div>
    <button type="button" id="btn-create" class="primary">部屋を作る</button>
    <button type="button" id="btn-enter" class="secondary">入る</button>
    <button type="button" id="btn-back" class="link">← 戻る</button>
  </section>

  <!-- 3. 注文画面(寮生ではない人) -->
  <section id="view-order" hidden>
    <h1>注文する</h1>
    <p id="order-who" class="lead"></p>
    <div id="order-members" class="card members"></div>
    <button type="button" id="btn-my-orders" class="my-orders-btn">
      <span>頼んだもの</span><span id="my-orders-count" class="my-orders-count"></span><span class="chev">›</span>
    </button>
    <p class="hint">ボタンを押すと1枚ずつ増えます(1つの料理につき4枚まで。5回押すと0枚に戻ります)。</p>
    <div id="menu" class="menu-grid"></div>
    <h2>選んだもの</h2>
    <div id="order-summary" class="card"></div>
    <div id="order-error" class="error"></div>
    <button type="button" id="btn-leave-order" class="link">部屋から出る</button>

    <div class="sticky-bar">
      <div class="total-bar">合計 <strong id="order-total">0円</strong></div>
      <div class="bar-actions">
        <button type="button" id="btn-undo" class="secondary">ひとつ戻す</button>
        <button type="button" id="btn-clear" class="secondary">全部消す</button>
        <button type="button" id="btn-submit" class="primary">頼む</button>
      </div>
    </div>
  </section>

  <!-- 4. 注文完了 -->
  <section id="view-done" hidden>
    <h1>注文しました</h1>
    <p id="done-pay" class="pay-note"></p>
    <div id="done-summary" class="card"></div>
    <button type="button" id="btn-done-my" class="secondary">頼んだものを見る・編集</button>
    <button type="button" id="btn-again" class="secondary">もう一度注文する</button>
    <button type="button" id="btn-leave-done" class="link">部屋から出る</button>
  </section>

  <!-- 5. 寮生の画面 -->
  <section id="view-dash" hidden>
    <h1>みんなの注文</h1>
    <p id="dash-who" class="lead"></p>
    <div id="dash-members" class="card members"></div>
    <div id="dash-blocked" class="card members" hidden></div>

    <div class="tabs">
      <button type="button" id="tab-today" class="tab active">今日</button>
      <button type="button" id="tab-cal" class="tab">カレンダー</button>
    </div>

    <div id="pane-today">
      <p id="today-label" class="hint"></p>
      <h2>買う数の合計</h2>
      <div id="dash-summary" class="card"></div>
      <h2>人ごとの注文(お金をもらったらチェック)</h2>
      <div id="dash-list"></div>
    </div>

    <div id="pane-cal" hidden>
      <div class="cal-head">
        <button type="button" id="cal-prev" class="cal-nav" aria-label="前の月">‹</button>
        <div id="cal-title" class="cal-title"></div>
        <button type="button" id="cal-next" class="cal-nav" aria-label="次の月">›</button>
        <button type="button" id="cal-today" class="cal-todaybtn">今日</button>
      </div>
      <div class="cal-week">
        <span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
      <p class="hint">名前をタップすると、注文の内容とお金のチェックがわかります。「+数字」や日付の空きをタップすると、その日の全員が見られます。</p>
    </div>

    <p id="dash-updated" class="hint"></p>
    <div id="dash-error" class="error"></div>
    <button type="button" id="btn-leave-dash" class="link">部屋から出る</button>
  </section>

</main>

  <!-- ポップアップ -->
  <div id="popup" class="popup" hidden>
    <div class="popup-backdrop"></div>
    <div class="popup-box" role="alertdialog" aria-modal="true">
      <p id="popup-text"></p>
      <button type="button" id="popup-ok" class="primary">OK</button>
    </div>
  </div>

  <!-- 下から出てくる詳細 -->
  <div id="sheet" class="sheet" hidden>
    <div id="sheet-backdrop" class="sheet-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button type="button" id="sheet-close" class="sheet-close" aria-label="閉じる">×</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=1.3"></script>
<script src="app.js?v=1.3"></script>
<script>
  // PWA: Service Worker を登録(ホーム画面への追加・起動の高速化)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
