<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>寮食堂 食券たのむ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>

  <!-- 1. 最初の画面 -->
  <section id="view-home">
    <h1>寮食堂 食券たのむ</h1>
    <p class="lead">名前を入れて、あてはまる方を選んでください。</p>
    <label>名前
      <input id="name" maxlength="20" autocomplete="off" placeholder="例: たろう">
    </label>
    <div id="home-error" class="error"></div>
    <button type="button" id="btn-resident" class="primary">寮生です</button>
    <button type="button" id="btn-guest" class="secondary">寮生ではありません</button>
  </section>

  <!-- 2. パスワード画面 -->
  <section id="view-pw" hidden>
    <h1 id="pw-title"></h1>
    <p id="pw-note" class="lead"></p>
    <label>パスワード
      <input id="pw-input" type="text" maxlength="30" autocomplete="off">
    </label>
    <p class="hint">※ 他のサービスと同じパスワードは使わないでください(簡易的な合言葉です)</p>
    <div id="pw-error" class="error"></div>
    <button type="button" id="btn-create" class="primary">部屋を作る</button>
    <button type="button" id="btn-enter" class="secondary">入る</button>
    <button type="button" id="btn-back" class="link">← 戻る</button>
  </section>

  <!-- 3. 注文画面(寮生ではない人) -->
  <section id="view-order" hidden>
    <h1>注文する</h1>
    <p id="order-who" class="lead"></p>
    <p class="hint">ボタンを押すと1枚ずつ増えます(1つの料理につき4枚まで。5回押すと0枚に戻ります)。</p>
    <div id="menu" class="menu-grid"></div>
    <h2>選んだもの</h2>
    <div id="order-summary" class="card"></div>
    <div id="order-error" class="error"></div>
    <button type="button" id="btn-leave-order" class="link">部屋から出る</button>

    <div class="sticky-bar">
      <div class="total-bar">合計 <strong id="order-total">0円</strong></div>
      <div class="bar-actions">
        <button type="button" id="btn-undo" class="secondary">ひとつ戻す</button>
        <button type="button" id="btn-clear" class="secondary">全部消す</button>
        <button type="button" id="btn-submit" class="primary">頼む</button>
      </div>
    </div>
  </section>

  <!-- 4. 注文完了 -->
  <section id="view-done" hidden>
    <h1>注文しました</h1>
    <p id="done-pay" class="pay-note"></p>
    <div id="done-summary" class="card"></div>
    <button type="button" id="btn-again" class="secondary">もう一度注文する</button>
    <button type="button" id="btn-leave-done" class="link">部屋から出る</button>
  </section>

  <!-- 5. 寮生の画面 -->
  <section id="view-dash" hidden>
    <h1>みんなの注文</h1>
    <p id="dash-who" class="lead"></p>
    <h2>買う数の合計</h2>
    <div id="dash-summary" class="card"></div>
    <h2>人ごとの注文</h2>
    <div id="dash-list"></div>
    <p id="dash-updated" class="hint"></p>
    <div id="dash-error" class="error"></div>
    <button type="button" id="btn-leave-dash" class="link">部屋から出る</button>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
